name: publish-container

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - package.json
      - scripts/**
      - src/**
      - .github/workflows/publish-container.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize Maritime boot shim
        shell: bash
        env:
          MARITIME_INIT_GZIP_B64: ${{ secrets.MARITIME_INIT_GZIP_B64 }}
        run: |
          test -n "$MARITIME_INIT_GZIP_B64"
          mkdir -p runtime
          printf '%s' "$MARITIME_INIT_GZIP_B64" | base64 --decode | gzip --decompress > runtime/maritime-init
          chmod 0755 runtime/maritime-init
          echo "c44d7d461ca5dd08bab3e44906334c9f7980907ae0ca0d8eccf62cd93415a55f  runtime/maritime-init" | sha256sum --check
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
